[package]
name = "frontend"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
gloo-net = "0.6"
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader", "ProgressEvent", "Storage", "Blob", "BlobPropertyBag", "Url", "FormData"] }
console_error_panic_hook = "0.1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid = { version = "1.11", features = ["serde", "v4", "js"] }
